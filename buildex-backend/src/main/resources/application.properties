spring.datasource.url=jdbc:postgresql://ep-withered-pine-a11qjzst-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&ssl=true&autosave=conservative
spring.datasource.username=neondb_owner
spring.datasource.password=npg_B5aXYL3msHvl
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# H2 Console (Disabled to save connections)
# ===============================
spring.h2.console.enabled=false

# ===============================
# SERVER
# ===============================
server.port=8081

# ===============================
# EMAIL (RESEND API)
# ===============================
resend.api.key=re_isWBNR3v_Dfsw1V2yzQc57ykm4SA8WTJa
resend.api.url=https://api.resend.com/emails

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# PERFORMANCE (GZIP)
# ===============================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024


# ===============================
# FRONTEND URL (For Share Redirects)
# ===============================
app.frontend.url=http://localhost:5173
